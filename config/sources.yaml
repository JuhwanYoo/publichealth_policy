    profile: media_general
    url: https://www.hani.co.kr/rss/society/
  - id: khan_society
    name: 경향신문 사회
    profile: media_general
    url: https://www.khan.co.kr/rss/rssdata/society_news.xml

  # ── 보건의료 전문지 ─────────────────────────────────────────────────
  - id: docdocdoc
    name: 청년의사
