# 수집 소스 정의.
#   kind: rss | pubmed
#   category: journal | media_general | media_health | gov
#   prefilter: none | keywords   (keywords = config/keywords.yaml 매칭 통과 항목만 분석)
#   lookback_hours: 이 시간 안에 발행된 항목만 수집
#   fetch_fulltext: 기사 본문을 trafilatura로 보강 (best-effort)
#
# ※ RSS URL은 공개된 주소를 바탕으로 작성했으며, 매체 개편으로 바뀔 수 있다.
#    `python -m policybrief check-feeds` 로 상태를 점검하고, 죽은 소스는 enabled: false 로 끈다.

defaults:
  journal:
    kind: pubmed
    category: journal
    lang: en
    lookback_hours: 336      # 14일 (PubMed 색인 지연 보정; 중복은 state로 제거)
    prefilter: none
    max_items: 40
  media_general:
    kind: rss
    category: media_general
    lang: ko
    lookback_hours: 36
    prefilter: keywords
    fetch_fulltext: true
    max_items: 300
  media_health:
    kind: rss
    category: media_health
    lang: ko
    lookback_hours: 36
    prefilter: none
    fetch_fulltext: true
    max_items: 80
  gov:
    kind: rss
    category: gov
    lang: ko
    lookback_hours: 48
    prefilter: none
    fetch_fulltext: false
    max_items: 60

# 종합의학 저널에서 정책 관련 논문만 고르기 위한 PubMed 검색식
policy_query: &policy_query >-
  (health policy[tiab] OR health care reform[tiab] OR healthcare reform[tiab]
  OR health insurance[tiab] OR Medicare[tiab] OR Medicaid[tiab]
  OR health system[tiab] OR health systems[tiab] OR universal health coverage[tiab]
  OR health financing[tiab] OR health expenditure[tiab] OR reimbursement[tiab]
  OR drug pricing[tiab] OR health workforce[tiab] OR public health policy[tiab]
  OR "Health Policy"[mh] OR "Health Care Reform"[mh] OR "Insurance, Health"[mh]
  OR "Delivery of Health Care"[mh:noexp] OR "Health Expenditures"[mh])

sources:
  # ── 핵심 보건정책 저널 (PubMed) ─────────────────────────────────────
  - id: health_affairs
    name: Health Affairs
    profile: journal
    journal: "Health Aff (Millwood)"
  - id: health_policy
    name: Health Policy
    profile: journal
    journal: "Health Policy"
  - id: milbank
    name: The Milbank Quarterly
    profile: journal
    journal: "Milbank Q"
  - id: jama_health_forum
    name: JAMA Health Forum
    profile: journal
    journal: "JAMA Health Forum"
  - id: lancet_public_health
    name: The Lancet Public Health
    profile: journal
    journal: "Lancet Public Health"
  - id: soc_sci_med
    name: Social Science & Medicine
    profile: journal
    journal: "Soc Sci Med"
    query: *policy_query
  - id: health_econ
    name: Health Economics
    profile: journal
    journal: "Health Econ"
  - id: hepl
    name: Health Economics, Policy and Law
    profile: journal
    journal: "Health Econ Policy Law"
  - id: hpp
    name: Health Policy and Planning
    profile: journal
    journal: "Health Policy Plan"
  - id: bmc_hsr
    name: BMC Health Services Research
    profile: journal
    journal: "BMC Health Serv Res"
    query: *policy_query
    max_items: 25

  # ── 종합의학 저널 정책 섹션 (PubMed + 정책 검색식) ──────────────────
  - id: nejm
    name: NEJM
    profile: journal
    journal: "N Engl J Med"
    query: *policy_query
  - id: jama
    name: JAMA
    profile: journal
    journal: "JAMA"
    query: *policy_query
  - id: bmj
    name: BMJ
    profile: journal
    journal: "BMJ"
    query: *policy_query
  - id: lancet
    name: The Lancet
    profile: journal
    journal: "Lancet"
    query: *policy_query

  # ── 국내 학술지 ────────────────────────────────────────────────────
  - id: kjhpm
    name: 보건행정학회지 (KJHPM)
    profile: journal
    kind: rss
    lang: ko
    url: https://www.kjhpm.or.kr/rss/rss.xml
    lookback_hours: 720
    enabled: false        # 2026-10-26 kjhpm.or.kr / kjhpm.org 모두 DNS 실패 — 학회지 사이트 주소 확인 필요

  - id: jpmph
    name: 예방의학회지 (JPMPH)
    profile: journal
    journal: "J Prev Med Public Health"

  - id: jkms
    name: JKMS (정책 논문)
    profile: journal
    journal: "J Korean Med Sci"
    query: *policy_query
  - id: hswr
    name: 보건사회연구 (KIHASA)
    profile: journal
    kind: rss
    lang: ko
    url: https://www.kihasa.re.kr/hswr/rss
    lookback_hours: 720
    enabled: false        # RSS 주소 미확인 — check-feeds로 확인 후 활성화

  # ── 일간지·통신사 (키워드 사전 필터) ────────────────────────────────
  - id: yna_society
    name: 연합뉴스 사회
